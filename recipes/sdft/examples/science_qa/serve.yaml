# SDFT on the reference's Science Q&A split, for recipes/sdft/examples/science_qa/run.sh.
#
# The policy is Qwen2.5-7B-Instruct, fully fine-tuned as in the paper (Table 5):
# learning rate 5e-5 with a cosine schedule and 10% warmup over the 167
# optimizer steps of two epochs, 32 prompts per step, one on-policy sample per
# prompt in a 1024-token window, forward KL to the demonstration-conditioned
# teacher, the reference's truncated importance-sampling cap of 2 and its
# three skipped leading tokens, no weight decay, gradient clipping at 1.
#
# GPU budget: four actor GPUs (tensor parallel 4, the frozen-nothing full
# model's Adam state fits beside its activations) and one rollout GPU; the
# five devices docker-compose.yaml hands the container. The teacher pass is a
# forward of the same actor over the demonstration prompts, so no further
# model is resident. Paths are the container's; run.sh mounts the model
# directory and the run directory.

schema-version: 2
reef:
  ready-timeout: 3600
  host: 0.0.0.0
  port: 28901
  token: ${REEF_TOKEN}                 # run.sh mints one per run
inference:
  model-path: /root/models/Qwen2.5-7B-Instruct
  timeout-s: 1800
  num-gpus: "1"
  tensor-parallel-size: "1"
  options:
    router-port: "23001"
    context-length: "4096"
    mem-fraction-static: "0.8"
  handler-factory: reef.inference.sglang.chat.SGLangInferenceHandler
  handler-config:
    # The reference samples through vLLM at temperature 1 with no nucleus,
    # top-k or repetition penalty; the requests set temperature and the
    # window, these fill in the rest (instead of the model's generation_config).
    sampling_defaults:
      top_p: 1.0
      top_k: -1
      repetition_penalty: 1.0
      max_new_tokens: 1024
recipe:
  implementation: recipes.sdft.recipe:SDFTRecipe
  config:
    batch-size: 32                     # MUST equal training.config.global_batch_size and run.py's PROMPTS_PER_STEP
    max-staleness: 0                   # on-policy: run.py waits for each step's release before sampling again
    tokenizer-path: /root/models/Qwen2.5-7B-Instruct  # the served model; recipe.config takes no ${} references
    max-teacher-tokens: 4096           # the trainer's seq-length; a longer teacher sequence is skipped and counted
    checkpoint-every-n-versions: 167   # one durable HF export, after the last step
training:
  backend: slime
  ready-timeout: 900
  ray-namespace: reef
  ray-actor-name: reef-train-bridge
  timeout-s: 3600
  config:
    checkpoint_dir: /var/lib/reef/checkpoints
    checkpoint_retention:
      max_storage_fraction: 0.80
      min_free_space_fraction: 0.10
      policy: latest
    global_batch_size: 32
  options:
    reef-checkpoint-max-storage-fraction: "${training.config.checkpoint_retention.max_storage_fraction}"
    reef-checkpoint-min-free-space-fraction: "${training.config.checkpoint_retention.min_free_space_fraction}"
    reef-checkpoint-policy: "${training.config.checkpoint_retention.policy}"
    megatron-to-hf-mode: "bridge"
    hf-checkpoint: "${inference.model-path}"
    load: "${training.config.checkpoint_dir}/megatron"
    save: "${training.config.checkpoint_dir}/megatron"
    save-interval: "1000"
    save-hf: "${training.config.checkpoint_dir}/hf/{rollout_id}"
    num-rollout: "100000000"
    rollout-batch-size: "${training.config.global_batch_size}"
    global-batch-size: "${training.config.global_batch_size}"
    micro-batch-size: "1"
    actor-num-nodes: "1"
    actor-num-gpus-per-node: "4"
    num-gpus-per-node: "5"
    tensor-model-parallel-size: "4"
    pipeline-model-parallel-size: "1"
    seq-length: "4096"
    rollout-max-response-len: "1024"
    rollout-max-context-len: "4096"
    # Qwen2.5 architecture flags beyond the sizes Reef reads from the HF config.
    padded-vocab-size: "152064"
    position-embedding-type: "rope"
    swiglu: true
    disable-bias-linear: true
    add-qkv-bias: true
    normalization: "RMSNorm"
    attention-dropout: "0.0"
    hidden-dropout: "0.0"
    attention-softmax-in-fp32: true
    accumulate-allreduce-grads-in-fp32: true
    attention-backend: "flash"
    sequence-parallel: true
    use-dynamic-batch-size: true
    max-tokens-per-gpu: "16384"
    log-probs-chunk-size: "1024"
    ckpt-fully-parallel-save: true
    # The paper's optimizer: TRL's AdamW defaults (no weight decay), 5e-5 with
    # cosine decay over the 167 steps of two epochs and a 10% warmup, clip 1.
    optimizer: "adam"
    lr: "5e-5"
    lr-decay-style: "cosine"
    lr-warmup-iters: "17"
    lr-decay-iters: "167"
    weight-decay: "0.0"
    clip-grad: "1.0"
    # The sdft loss family: a custom loss over the self-teacher's distributions;
    # Slime's own advantage and old-log-prob pass stays off.
    loss-type: "custom_loss"
    use-rollout-logprobs: true
    disable-compute-advantages-and-returns: true
    sdft-kl-direction: "forward"
    sdft-importance-sampling-cap: "2.0"
    sdft-skip-response-tokens: "3"
    n-samples-per-prompt: "1"
    rollout-temperature: "1.0"
storage:
  artifact-repository: /var/lib/reef/artifacts.git
  artifact-work-dir: /var/lib/reef/artifact-work
  artifact-cache-dir: /var/lib/reef/artifact-cache
  agent-record-dir: /var/lib/reef/agent-record

execution:
  training: ray
  rollout: ray

observability:
  wandb:
    enabled: false
    project: reef
    tags: []
    mode: online
    directory: /var/lib/reef/wandb
    upload_checkpoints: false
