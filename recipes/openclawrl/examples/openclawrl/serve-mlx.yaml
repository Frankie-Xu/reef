# OpenClaw-RL on Apple Silicon: the policy serves and trains in this process.
#
# The sibling serve.yaml is the reference deployment — seven GPUs, Megatron on
# four, a rollout engine, a served PRM and a 32B student. This one keeps the
# policy in the Reef process on MLX and sends the two roles that only ever need
# text (the PRM's votes, the student's reactions) to a hosted model.
#
# Launch it host-native, not in the compose stack: `reef serve -c` this file,
# then point the harness at the machine's LAN address. The task containers
# reach the service over that interface, so `reef.host` binds 0.0.0.0.
#
# Two things about the paths below. They are relative, so they resolve against
# the process's working directory: two runs launched from the same checkout
# share one artifact repository, and the second is refused with "training is
# already bound to scenario". Give each run its own `run-dir` and `storage`
# paths, or launch it from its own directory.
schema-version: 2

reef:
  host: 0.0.0.0
  port: 8904
  token: reef-local
  run-dir: work/mlx/stack
  ready-timeout: 1800

inference:
  # The engine loads this itself, from a local path or the Hub; there is no
  # separate inference service to point at.
  model-path: mlx-community/Qwen3.5-9B-MLX-4bit

training:
  backend: mlx
  options:
    checkpoint_dir: work/mlx/checkpoints
    # Every layer trains. The 9B is 32 layers, 24 of them GatedDeltaNet, whose
    # kernel has no vjp; the engine runs that recurrence chunkwise in training
    # mode and, with checkpoint_layers, recomputes each layer's forward in the
    # backward, so the gradient crosses all 32.
    lora_layers: 32
    lora_rank: 64
    checkpoint_layers: true
    # k_proj and v_proj are adapted here, which rules out a cached prompt
    # prefill: it would freeze tensors that depend on trained weights.
    # in_proj_qkv is the GatedDeltaNet layers' own projection — without it
    # those layers would only be crossed, never trained.
    lora_keys:
      - mlp.gate_proj
      - mlp.up_proj
      - mlp.down_proj
      - self_attn.q_proj
      - self_attn.k_proj
      - self_attn.v_proj
      - self_attn.o_proj
      - linear_attn.in_proj_qkv
    learning_rate: 3.0e-5
    max_tokens: 2048
    # Chunk the [response, vocab] head so a long response's backward fits.
    log_probs_chunk_size: 512
    # The top-K the policy considered while generating. The openclawrl
    # objective distils onto those candidates, so it cannot be rebuilt later.
    capture_topk: 4
    # Frozen-base KL. Without it earlier runs collapsed into an unconditional
    # tool loop: it prices the drift neither objective term targets.
    kl_coef: 0.05

recipe:
  implementation: recipes.openclawrl.recipe:OpenClawRLRecipe
  config:
    # Judged turns per optimizer step; the reference uses 16. Halved so a
    # 72-session stream still produces enough steps to see movement on one
    # machine, at the cost of a noisier gradient.
    batch-size: 8
    # A session's last turn has no next message to be judged by, so it only
    # trains once the session has been idle this long.
    session-ttl-s: 45
    checkpoint-every-n-versions: 1
    prm-url: https://openrouter.ai/api/v1/chat/completions
    prm-api: openai
    prm-model: z-ai/glm-5.3
    # The credential is read from this environment variable; the config never
    # holds it.
    prm-api-key-env: OPENROUTER_API_KEY
    prm-m: 3
    # GLM-5.3 cannot have reasoning disabled and bills it against this budget.
    # Too small and the vote returns null content — a silent failure, not an
    # error — so leave the judge room to think.
    prm-max-tokens: 16384
    # The policy's own tokenizer: the teacher renders hint-enhanced prompts
    # with it whatever dialect the judge happens to speak.
    prm-tokenizer-path: mlx-community/Qwen3.5-9B-MLX-4bit

storage:
  agent-record-dir: work/mlx/agent-record
  artifact-repository: work/mlx/artifacts.git
  artifact-work-dir: work/mlx/artifact-work
  artifact-cache-dir: work/mlx/artifact-cache

# The candidate gate: every candidate runs a pinned style probe before it can
# reach serving, and a step whose clean rate regresses past the margin is held
# out instead of published. Remove this section and the trainer falls back to
# the `always` policy, which publishes every step.
#
# The probe generates from the candidate's weights, so it needs a training
# runtime that can hold an unpublished candidate — this one. A runtime whose
# candidates live in another process is refused rather than silently degrading.
evaluation:
  module: recipes.openclawrl.candidate_evaluator:OpenClawRLCandidateEvaluation
  config:
    probe_size: 8
    max_tokens: 96
    regression_margin: 0.17
