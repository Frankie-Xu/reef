name: CI approval

# Keep approval separate from PR code: this job checks metadata only.
on:
  workflow_call:
    outputs:
      run_attempt:
        description: The attempt explicitly started by a maintainer.
        value: ${{ jobs.approve.outputs.run_attempt }}

permissions:
  contents: read
  pull-requests: read

jobs:
  approve:
    name: Approve full CI
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run_attempt: ${{ steps.authorize.outputs.run_attempt }}
    steps:
      - name: Authorize full CI
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$GITHUB_RUN_ATTEMPT" -eq 1 ]; then
            echo "::error::Awaiting maintainer approval. Run: gh run rerun $GITHUB_RUN_ID --repo $GITHUB_REPOSITORY"
            exit 1
          fi
          # actor remains the original PR author on reruns; triggering_actor
          # identifies the person who actually requested this attempt.
          role=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$GITHUB_TRIGGERING_ACTOR/permission" --jq .role_name)
          case "$role" in
            maintain|admin) ;;
            *)
              echo "::error::Full CI requires repository maintain or admin permission."
              exit 1 ;;
          esac
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
              --jq '[.state, .draft, .head.sha] | @tsv')
            expected=$(printf 'open\tfalse\t%s' "$EXPECTED_HEAD_SHA")
            if [ "$current" != "$expected" ]; then
              echo "::error::This PR is closed, draft, or has newer commits. Rerun its latest ready run."
              exit 1
            fi
          elif [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then
            echo "::error::Unsupported CI approval event."
            exit 1
          fi
          echo "run_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
