name: Docs Build

on:
  # Run on every pull request so docs-gate is always available as a stable
  # required check. The path filter remains on main pushes to avoid needless
  # post-merge builds.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "docs/**"
      - "docker/**/*.md"
      - "recipes/**/*.md"
      - "reef/**/*.md"
      - "recipes/basic/local-sglang.yaml"
      - "reef/service/deploy/**"
      - "reef/service/app.py"
      - ".github/workflows/docs-build.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: docs-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  approval:
    if: github.event_name != 'push' && !github.event.pull_request.draft
    uses: ./.github/workflows/ci-approval.yml

  build:
    name: Build documentation
    needs: [approval]
    if: >-
      !cancelled() &&
      (github.event_name == 'push' ||
      (needs.approval.result == 'success' && needs.approval.outputs.run_attempt == format('{0}', github.run_attempt)))
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs/site
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check documentation links
        run: npm run check:docs

      - name: Lint documentation site
        run: npm run lint

      - name: Build documentation site
        run: npm run build

  gate:
    name: docs-gate
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the documentation build to pass
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = success
